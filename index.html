<style>html,body{margin:0}:root{padding-top:env(safe-area-inset-top,0px)}img{max-width:100%}[hidden]{display:none!important}
/* Layout: one sunny sticker-style screen. Fight stage on top, one next action card, three tabs at the bottom. */
:root{
  color-scheme:light;
  --sun:#FFD53D; --sun2:#FFE680; --ink:#1E1633; --card:#FFFFFF; --soft:#FFF4C2; --mute:#5C5470;
  --hd:#2456E6; --nk:#F0257D; --good:#17A34A; --bad:#E5352B; --wait:#E08600;
  --display:"Lilita One","Arial Rounded MT Bold","Arial Black",sans-serif;
  --body:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--sun);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.3;font-weight:500;min-height:100%;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.45;cursor:not-allowed}
a{color:inherit}
:focus-visible{outline:3px solid var(--hd);outline-offset:2px}
input,textarea{font:inherit;color:var(--ink)}
p{margin:0}
h2,h3{margin:0;font-family:var(--display);font-weight:400;line-height:1.1;text-wrap:balance}
h2{font-size:26px}h3{font-size:20px}
#app{max-width:480px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:10px 92px;display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.logo{font-family:var(--display);font-size:24px}
.pill{background:var(--ink);color:#fff;border-radius:99px;padding:3px 11px;font-size:13px;font-weight:700;white-space:nowrap}
.demo{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;font-weight:600}
.demo button{padding:3px 10px;border-radius:99px;border:2px solid var(--ink);background:#fff;font-weight:700;min-height:30px}
.demo button[aria-pressed="true"]{background:var(--ink);color:#fff}
.hp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hp>div{min-width:0}
.hp .nm{display:flex;justify-content:space-between;font-family:var(--display);font-size:16px}
.hp .n .nm{flex-direction:row-reverse}
.bar{height:18px;border:3px solid var(--ink);border-radius:10px;background:#fff;overflow:hidden;position:relative;margin-top:2px}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--hd);transition:width .35s}
.hp .n .bar i{left:auto;right:0;background:var(--nk)}
.stage{border:4px solid var(--ink);border-radius:26px;overflow:hidden;line-height:0;position:relative;background:var(--sun2);box-shadow:0 5px 0 var(--ink)}
.stage canvas{width:100%;height:auto;display:block;touch-action:manipulation;cursor:pointer}
.cap{position:absolute;left:10px;right:10px;bottom:10px;text-align:center;line-height:1.15}
.cap span{display:inline-block;background:var(--ink);color:#fff;border-radius:12px;padding:5px 11px;font-weight:700;font-size:14px}
.card{background:var(--card);border:3px solid var(--ink);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 4px 0 var(--ink);min-width:0}
.card.hot{background:#FFE1EE}
.card.boss{background:#E4ECFF}
.eyebrow{font-weight:700;font-size:13px;color:var(--mute)}
.big{font-family:var(--display);font-size:25px;line-height:1.08}
.sub{font-size:14px;color:var(--mute);line-height:1.25}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>.btn{flex:1 1 30%}
.btn{min-height:50px;padding:7px 14px;border-radius:15px;border:3px solid var(--ink);background:var(--sun);font-family:var(--display);font-size:17px;box-shadow:0 4px 0 var(--ink);transition:transform .06s,box-shadow .06s;text-align:center;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;line-height:1.05}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.g{background:#7FE39B}.btn.r{background:#FF9C92}.btn.w{background:#fff}.btn.p{background:#FF8CC0}.btn.b{background:#9DB9FF}
.btn.small{min-height:44px;font-size:15px;padding:5px 11px}
.chips{display:flex;gap:7px;overflow-x:auto;padding:3px 2px 7px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-height:48px;padding:3px 12px;border:3px solid var(--ink);border-radius:15px;background:#fff;font-weight:700;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}

.chip.ok{background:#7FE39B}.chip.pending{background:#FFD98A}.chip.no{background:#FF9C92}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:9px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--ink);padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);z-index:20}
nav.tabs div{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}

.dot{display:inline-block;min-width:19px;height:19px;border-radius:10px;background:var(--bad);color:#fff;font:700 12px/19px var(--body);margin-left:5px;padding:0 4px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.game{background:#fff;border:3px solid var(--ink);border-radius:20px;padding:12px;text-align:left;box-shadow:0 4px 0 var(--ink);display:flex;flex-direction:column;gap:3px;min-height:112px}
.game:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.game b{font-family:var(--display);font-weight:400;font-size:18px;line-height:1.05}
.game span{font-size:13px;color:var(--mute);line-height:1.2}

.head{border-radius:50%;border:3px solid var(--ink);object-fit:cover;background:#fff;display:block;flex:0 0 auto}
.lad{display:flex;flex-direction:column;gap:5px}
.lad>div{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:42px;padding:3px 10px;border-radius:12px;background:var(--soft)}
.lad b{font-family:var(--display);font-weight:400;font-size:16px}
.lad span{font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.lad .hs{display:flex;gap:3px;align-items:center}
.stat{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.stat b{font-variant-numeric:tabular-nums;text-align:right}
.track{height:14px;border:3px solid var(--ink);border-radius:9px;background:#fff;overflow:hidden}
.track i{display:block;height:100%;background:var(--bad)}
.feed{display:flex;flex-direction:column;gap:6px;font-size:14px}
.feed div{display:flex;gap:7px;align-items:center}
details{font-size:14px}
summary{font-family:var(--display);font-size:18px;cursor:pointer;min-height:44px;display:flex;align-items:center}
details li{margin-bottom:5px}
details ul{padding-left:18px;margin:4px 0}
.field{width:100%;min-height:52px;padding:8px 12px;border:3px solid var(--ink);border-radius:14px;background:#fff}
#ov>.sheet{position:fixed;inset:0;z-index:40;background:rgba(30,22,51,.72);display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--sun2);width:100%;max-width:480px;border:4px solid var(--ink);border-bottom:0;border-radius:26px 26px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px;max-height:92%;overflow:auto;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.3}}
.full{position:fixed;inset:0;z-index:50;background:var(--sun);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));text-align:center;overflow:auto;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.full.dark{background:var(--ink);color:#fff}
.full.pink{background:#FF8CC0}
.full.blue{background:#9DB9FF}
.num{font-family:var(--display);font-size:clamp(64px,22vw,110px);line-height:1}
.bubble{background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:18px;padding:9px 16px;font-family:var(--display);font-size:22px;line-height:1.1;max-width:340px;animation:pop .25s}
.big-head{width:min(60vw,250px);height:min(60vw,250px);border-width:6px;animation:bob 1.3s ease-in-out infinite}
.big-head.hit{animation:smack .16s}
@keyframes bob{50%{transform:translateY(-8px) rotate(2deg)}}
@keyframes smack{30%{transform:scale(.86) rotate(-11deg)}70%{transform:scale(1.07) rotate(7deg)}}
@keyframes pop{from{transform:scale(.5);opacity:0}}
.fly{position:fixed;font-family:var(--display);font-size:26px;color:var(--bad);pointer-events:none;z-index:60;animation:fly .6s ease-out forwards}
@keyframes fly{to{transform:translateY(-70px) scale(1.4);opacity:0}}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:13px;padding:8px 14px;font-weight:700;z-index:70;width:max-content;max-width:calc(100% - 32px);text-align:center;animation:tin .2s}
@keyframes tin{from{transform:translate(-50%,10px);opacity:0}}
.wheel{width:230px;height:230px;border-radius:50%;border:6px solid var(--ink);background:conic-gradient(#FF8CC0 0 60deg,#9DB9FF 0 120deg,#7FE39B 0 180deg,#FFD53D 0 240deg,#FF9C92 0 300deg,#fff 0);transition:transform 3.2s cubic-bezier(.15,.8,.2,1);position:relative}
.ptr{width:0;height:0;border-left:15px solid transparent;border-right:15px solid transparent;border-top:26px solid var(--ink);margin-bottom:-22px;z-index:2}
.crop{position:relative;width:260px;height:260px;border-radius:50%;overflow:hidden;border:5px solid var(--ink);align-self:center;touch-action:none;background:#fff;cursor:grab}
.crop canvas{width:100%;height:100%}
.faces{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.faces button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px;font-weight:700;min-height:44px}
.login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:16px}
.who{display:flex;gap:18px}
.who button{display:flex;flex-direction:column;gap:4px;align-items:center;font-family:var(--display);font-size:17px;min-height:44px}
.who button[aria-pressed="true"] img{outline:5px solid var(--ink);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

.head.cut{border:0;border-radius:0;background:none;object-fit:contain}
img.head[src^="data:image/webp"]{border:0;border-radius:0;background:none;object-fit:contain}
</style></head><body>
<div id="app"></div>

<script src="config.js"></script>
<script>/* Game rules. Everything on screen is worked out from one list of events, so both phones always agree. */
const CONF=(typeof window!=='undefined'&&window.DANGAL_CONFIG)||{};
const RULES=CONF.rules||{};
const rh=RULES.harshdeep||{},rn=RULES.nikki||{};
const PL={
  h:{name:'Harshdeep',email:'harshdeep@example.com',gymT:rh.gymDays||4,cp:5,stepT:rh.stepTarget||6000,stepGoal:rh.stepLabel||'6,000 to 7,000'},
  n:{name:'Nikki',email:'nikki@example.com',gymT:rn.gymDays||5,cp:10,stepT:rn.stepTarget||10000,stepGoal:rn.stepLabel||String((rn.stepTarget||10000).toLocaleString('en-IN'))}
};
PL.h.gp=80/PL.h.gymT;PL.n.gp=80/PL.n.gymT;
const START=CONF.seasonStart||null;
const rival=k=>k==='h'?'n':'h';
const RANKS=[['Gully Fighter',0],['Mohalla Don',400],['Zila Champion',1000],['State Champion',2000],['Rustam-e-Hind',4000]];
const DOSTI=[['Hi-Bye Friends',0],['Gym Buddies',10],['Best Rivals',30],['Partners in Crime',70],['Best Enemies',140]];
const BOSSES=[['Samosa Raja','#E8A33D'],['Gulab Jamun Baba','#A84B24'],['Momo Monster','#F2E3C6'],['Vada Pav Vikram','#D98B3A'],['Chole Bhature Chacha','#C9702C'],['Biryani Bhai','#E06C2B']];
const RAID_T=RULES.bossRaidSteps||120000, KO_PTS=170, MAX_REJ=RULES.rejectionsPerWeek||3;
const SPLIT=rn.split||['Chest, triceps, shoulders','Hamstrings, glutes','Back, biceps','Full legs','Core',null,null];
const MEALS=['Breakfast','Lunch','Dinner'];
const QUESTIONS=CONF.questions||['Gym mein sabse irritating banda kaun hota hai?','Agar ek hi cheat meal zindagi bhar khana ho, kya hoga?','Tumhara gym wala gaana kaunsa hai?','Bachpan ka sabse bakwaas nickname?','Aaj ka mood ek film title mein batao.','Sabse weird cheez jo tumhe calm karti hai?','Kaunsa exercise tumhara dushman hai?','Ek din ke liye kisi ki body mil jaaye, kiski?','Last time kis baat pe bohot hasi aayi thi?','Sabse bada jhooth jo gym ke baare mein bola?','Aisa kaunsa khana hai jo sab pasand karte hain, tumhe nahi?','Kaunsi cheez mein tum secretly bohot ache ho?','Ek skill jo tum 30 din mein seekhna chahoge?','Tumhari life ka theme song kya hoga?','Sabse embarrassing moment jo ab funny lagta hai?','Late night ka sabse dangerous craving?','Agar kal chhutti ho, kya karoge?','Kaunsa reel tumne 10 baar dekha hai?','Tumhari sabse irritating aadat?','Bina phone ek din, sabse zyada kya miss hoga?','Tumhara comfort show kaunsa hai?','Is hafte ki ek choti si jeet batao.','Sabse overrated fitness advice?','Agar tumhara ek reality show ho, naam kya hoga?','Aaj kisne tumhara din better banaya?','Mummy ke haath ki best cheez?','Sabse bekaar gift jo kabhi mila?','Tumhare bare mein log kya galat sochte hain?','Next trip kahan honi chahiye?','Ek cheez jo tum dobara try karna chahte ho?'];
const CHALLENGES=CONF.challenges||[['20 squats',15],['15 push-ups',15],['60 second plank',15],['30 jumping jacks',15],['500 extra steps',20],['20 lunges',15]];
const FORFEITS=CONF.forfeits||['Winner picks your next story','Winner writes your next caption','Post a reel winner chooses','Send your worst gym selfie','Buy the winner a meal','50 squats, on snap'];
const NUDGES=CONF.nudges||['Steps kahan hain?','Gym gaye kya?','Snap nahi aaya abhi tak','Uth ja, chal','Khana khaya?','Sona bhi hai, phone rakho'];
const HYPES=CONF.hypes||['Kya baat hai!','Machine ho tum','Respect','Aaj toh aag laga di','Thoda dheere, mujhe bhi jeetna hai','Proud of you, thoda sa'];
const FORMS=['Rock','Paper','Dumbbell'];

const IST=19800000,DAY=86400000,SHIFT=3*3600000;
const pad=n=>String(n).padStart(2,'0');
const istDate=t=>new Date(t+IST);
const rawKey=t=>{const d=istDate(t);return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())};
const dayKey=t=>rawKey(t-SHIFT); /* a day runs until 3 AM, so late dinners count for the right day */
const keyTs=k=>{const[y,m,d]=k.split('-').map(Number);return Date.UTC(y,m-1,d)-IST};
const addDays=(k,n)=>rawKey(keyTs(k)+n*DAY+1000);
const dayIdx=k=>(new Date(keyTs(k)+IST).getUTCDay()+6)%7;
const weekOf=k=>addDays(k,-dayIdx(k));
const hourIst=t=>{const d=istDate(t);return d.getUTCHours()+d.getUTCMinutes()/60};
const dayNum=k=>{let h=0;for(const c of k)h=(h*33+c.charCodeAt(0))%100003;return h};
const questionFor=k=>QUESTIONS[dayNum(k)%QUESTIONS.length];
const bossFor=w=>BOSSES[dayNum(w)%BOSSES.length];
const rankOf=x=>{let r=0;RANKS.forEach((a,i)=>{if(x>=a[1])r=i});return r};
const dostiOf=x=>{let r=0;DOSTI.forEach((a,i)=>{if(x>=a[1])r=i});return r};
const claimLabel=c=>({gym:'Gym done',planb:'Plan B, '+fmtN(c.n)+' steps',cardio:'40 min incline',steps:fmtN(c.n)+' steps',meal:MEALS[c.slot],sleep:'Asleep by 12:30',content:'Content posted'})[c.q];
const fmtN=n=>Number(n||0).toLocaleString('en-IN');

function compute(evs,t){
  const started=START&&dayKey(t)>=START;
  const list=(started?evs.filter(e=>dayKey(e.ts)>=START):[...evs]).sort((a,b)=>a.ts-b.ts||(a.id<b.id?-1:1));
  const newP=()=>({days:{},pts:0,gym:0,planb:0,content:0,dmg:0});
  const S={claims:{},weeks:{},hits:[],xp:{h:0,n:0},tokens:{h:0,n:0},clean:{h:0,n:0},karz:{h:0,n:0},dosti:0,
    records:{nose:{h:0,n:0},plank:{h:0,n:0},slap:{h:0,n:0}},games:{},rpd:[],races:[],ambushes:[],answers:{},nudges:[],spins:{},redeems:[],results:[],
    cur:weekOf(dayKey(t)),today:dayKey(t),t,practice:!!(START&&!started)};
  const wk=w=>S.weeks[w]||(S.weeks[w]={k:w,p:{h:newP(),n:newP()},rej:{h:0,n:0},raid:0,used:false});
  const hit=(w,id,ts,by,amt,label,kind)=>S.hits.push({w,id,ts,by,amt,label,kind});
  const dayLog={};
  const once=(a,k,d)=>{const key=a+k+d;if(dayLog[key])return false;dayLog[key]=1;return true};
  const capAdd=(a,k,d,cap,v)=>{const key='cap'+a+k+d;const used=dayLog[key]||0;const g=Math.min(v,Math.max(0,cap-used));dayLog[key]=used+g;return g};
  for(const e of list){
    const a=e.actor,d=e.data||{},ek=dayKey(e.ts),w=weekOf(ek);
    if(e.type==='claim'){
      S.claims[e.id]={...d,id:e.id,actor:a,ts:e.ts,status:'pending'};
    }else if(e.type==='verdict'){
      const c=S.claims[d.claim];
      if(!c||c.actor===a||c.status!=='pending')continue;
      if(d.v==='ok'){c.status='ok';c.res=e.ts}
      else{const W=wk(weekOf(c.day));if(W.rej[a]<MAX_REJ){W.rej[a]++;c.status='no';c.res=e.ts}}
    }else if(e.type==='poke'){
      const c=S.claims[d.claim];if(c)c.poked=e.ts;
    }else if(e.type==='nudge'){
      S.nudges.push({id:e.id,ts:e.ts,from:a,text:d.text,kind:d.kind});
      if(d.kind==='hype'&&once(a,'hype',ek)){S.dosti+=1}
    }else if(e.type==='ambush'){
      S.ambushes.push({id:e.id,ts:e.ts,from:a,ch:d.ch,mins:CHALLENGES[d.ch]?CHALLENGES[d.ch][1]:15,done:null});
    }else if(e.type==='ambush_done'){
      const m=S.ambushes.find(x=>x.id===d.ambush);
      if(m&&m.from!==a&&!m.done&&e.ts<=m.ts+m.mins*60000)m.done=e.ts;
    }else if(e.type==='nose'){
      S.records.nose[a]=Math.max(S.records.nose[a],d.reps||0);
      const g=capAdd(a,'nose',ek,6,Math.floor((d.reps||0)/5));
      if(g>0){hit(w,'g'+e.id,e.ts,a,g,d.reps+' nose push-ups','game');S.xp[a]+=g}
    }else if(e.type==='plank'){
      const best=S.records.plank[rival(a)];
      const beat=best>0&&(d.ms||0)>best&&once(a,'plankwin',ek);
      S.records.plank[a]=Math.max(S.records.plank[a],d.ms||0);
      if(beat){hit(w,'g'+e.id,e.ts,a,5,'Plank record broken','game');S.xp[a]+=5}
    }else if(e.type==='slap'){
      S.records.slap[a]=Math.max(S.records.slap[a],d.n||0);
      if(once(a,'slap',ek)){const g=Math.min(10,Math.floor((d.n||0)/10));S.xp[a]+=g;hit(w,'g'+e.id,e.ts,a,Math.min(3,g),d.n+' thappad','game')}
    }else if(e.type==='rpd'){
      S.rpd.push({id:e.id,ts:e.ts,from:a,move:d.move,reply:null});
    }else if(e.type==='rpd_reply'){
      const g=S.rpd.find(x=>x.id===d.game);
      if(g&&g.from!==a&&g.reply===null){
        g.reply=d.move;g.rts=e.ts;
        const r=(g.move-d.move+3)%3; /* Paper beats Rock, Dumbbell beats Paper, Rock beats Dumbbell */
        g.winner=r===0?null:r===1?g.from:a;
        if(g.winner){hit(w,'g'+e.id,e.ts,g.winner,3,'Rock, Paper, Dumbbell','game');S.xp[g.winner]+=3}
      }
    }else if(e.type==='race_start'){
      S.races.push({id:e.id,ts:e.ts,from:a,logs:{}});
    }else if(e.type==='race_log'){

    const wob=Math.sin(ts/40)*this.wig[k]*.35+(pose==='hit'?-.18:0)+(REDUCED?0:Math.sin(off*2)*.025);
    c.save();c.translate(0,hy);c.rotate(wob);c.scale(dir,1);
    const cool=expr==='cool';const img=faceImg(k,cool?'smug':expr);const cut=isCut(img.src);
    if(cut&&img.complete&&img.naturalWidth){const H2=R*2.5,W2=H2*img.naturalWidth/img.naturalHeight;c.drawImage(img,-W2/2,-H2/2-6,W2,H2)}
    else{c.save();c.beginPath();c.arc(0,0,R,0,7);c.clip();
    if(img.complete&&img.naturalWidth)c.drawImage(img,-R,-R,R*2,R*2);else{c.fillStyle=skin;c.fill()}
    c.restore();
    c.strokeStyle=ink;c.lineWidth=7;c.beginPath();c.arc(0,0,R,0,7);c.stroke()}
    const eyes=cut?(k==='h'?{a:-17,b:29,y:-6}:{a:-6,b:33,y:-10}):{a:-34,b:34,y:12};
    /* expression extras work on real photos too */
    const t=ts/1000;
    if(expr==='sad'&&pose!=='ko'){c.fillStyle='#5AB3FF';for(const s of[eyes.a,eyes.b]){const f=(t*1.4+(s>0?.5:0))%1;c.beginPath();c.arc(s,eyes.y+8+f*62,8,0,7);c.fill()}}
    if(cool){const m=(eyes.a+eyes.b)/2,g=(eyes.b-eyes.a)/2+3;c.fillStyle=ink;c.strokeStyle=ink;c.lineWidth=5;c.fillRect(m-g-21,eyes.y-12,42,25);c.fillRect(m+g-21,eyes.y-12,42,25);c.beginPath();c.moveTo(m-g,eyes.y-8);c.lineTo(m+g,eyes.y-8);c.stroke();c.fillStyle='#fff';c.fillRect(m-g-14,eyes.y-7,10,5);c.fillRect(m+g-14,eyes.y-7,10,5)}
    if(expr==='hurt'){c.save();c.translate(eyes.b+8,eyes.y-34);c.rotate(.6);c.fillStyle='#F2C9A0';c.strokeStyle=ink;c.lineWidth=3;c.fillRect(-22,-7,44,14);c.strokeRect(-22,-7,44,14);c.rotate(1.57);c.fillRect(-22,-7,44,14);c.strokeRect(-22,-7,44,14);c.restore();c.fillStyle='rgba(229,53,43,.35)';c.beginPath();c.arc(eyes.a-8,eyes.y+26,20,0,7);c.fill()}
    if(expr==='sweat'){c.fillStyle='#8FD6FF';const f=t%1;c.beginPath();c.arc(58,-40+f*46,10,0,7);c.fill()}
    if(expr==='sleepy'){c.fillStyle=ink;c.font='34px "Lilita One",sans-serif';c.textAlign='left';c.fillText('Zzz',44,-58-(t%1)*12)}
    if(pose==='ko'){c.fillStyle='#FFD53D';c.strokeStyle=ink;c.lineWidth=3;for(let i=0;i<4;i++){const a=t*3+i*1.57;c.beginPath();c.arc(Math.cos(a)*75,-70+Math.sin(a)*16,9,0,7);c.fill();c.stroke()}}
    c.restore();
    c.restore();
  }
}

/* ---------- Saving and syncing ---------- */
const store={
  async add(ev){
    if(!LIVE){lsSet('demo',events);return}
    const{error}=await sb.from('events').insert(ev);
    if(error){events=events.filter(e=>e.id!==ev.id);refresh();toast('Save nahi hua. Net check karo, phir try karo.')}
  },
  async loadAll(){
    const out=[];let from=0;const size=1000;
    for(;;){const{data,error}=await sb.from('events').select('*').order('ts').range(from,from+size-1);if(error)throw error;out.push(...data);if(data.length<size)break;from+=size}
    const{data:fs}=await sb.from('faces').select('*');
    faces={h:{},n:{}};(fs||[]).forEach(f=>{if(faces[f.player])faces[f.player][f.expr]=f.data});
    return out;
  },
  async sync(){
    if(!LIVE||!sb||!me)return;
    const since=(events.length?Math.max(...events.map(e=>e.ts)):0)-120000;
    const{data}=await sb.from('events').select('*').gt('ts',since).order('ts').limit(500);
    let ch=false;(data||[]).forEach(e=>{if(!events.some(x=>x.id===e.id)){events.push(e);ch=true}});
    if(ch)refresh();
  },
  subscribe(){
    sb.channel('dangal').on('postgres_changes',{event:'INSERT',schema:'public',table:'events'},p=>{if(!events.some(x=>x.id===p.new.id)){events.push(p.new);refresh()}})
      .on('postgres_changes',{event:'*',schema:'public',table:'faces'},p=>{const f=p.new;if(f&&faces[f.player]){faces[f.player][f.expr]=f.data;refresh()}}).subscribe();
  },
  async saveFace(expr,data){
    faces[me][expr]=data;
    if(LIVE){const{error}=await sb.from('faces').upsert({player:me,expr,data});if(error)toast('Photo save nahi hui. Phir try karo.')}
    else lsSet('faces',faces);
  }
};

/* ---------- Refresh and animating new hits ---------- */
let seenHits=new Set(),seenNudges=new Set(),booted=false;
function refresh(){
  S=compute(events,now());
  setLooks(stage,S);
  const fresh=S.hits.filter(h=>h.w===S.cur&&!seenHits.has(h.id));
  if(!booted){
    const last=lsGet('seen-'+me,0);
    const away=fresh.filter(h=>h.ts>last).slice(-6);
    const playing=new Set(away.map(h=>h.id));
    let base={h:100,n:100};
    for(const h of S.hits)if(h.w===S.cur&&!playing.has(h.id)){base[rival(h.by)]-=h.amt}
    stage.hp={h:Math.max(0,base.h),n:Math.max(0,base.n)};
    away.forEach(queueHit);
    S.hits.forEach(h=>seenHits.add(h.id));S.nudges.forEach(n=>{if(n.ts<=last)seenNudges.add(n.id)});
    booted=true;
  }else{
    fresh.forEach(h=>{queueHit(h);seenHits.add(h.id)});
  }
  /* correct any drift once nothing is playing */
  if(!stage.cur&&!stage.q.length)stage.hp={h:S.week.hp.h,n:S.week.hp.n};
  lsSet('seen-'+me,now());
  render();checkPopups();
}

function b64u(s){const p=s.replace(/-/g,'+').replace(/_/g,'/')+'==='.slice(0,(4-s.length%4)%4);return Uint8Array.from(atob(p),c=>c.charCodeAt(0))}
async function togglePush(){
  try{
    const reg=await navigator.serviceWorker.ready;
    if(pushOn){const s=await reg.pushManager.getSubscription();if(s){await sb.from('push_subs').delete().eq('endpoint',s.endpoint);await s.unsubscribe()}pushOn=false;lsSet('push',false);render();return}
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){toast('Notifications are blocked in your phone settings.');return}
    const s=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(CFG.vapidPublicKey)});
    const{error}=await sb.from('push_subs').upsert({endpoint:s.endpoint,player:me,sub:s.toJSON()});
    if(error)throw error;
    pushOn=true;lsSet('push',true);render();toast('Notifications on');
  }catch(e){toast('Notifications could not turn on on this phone.')}
}

  let img=null,z=1,ox=0,oy=0,drag=null;
  const cc=document.getElementById('cc'),cx=cc.getContext('2d');
  const paint=()=>{if(!img)return;const b=Math.max(320/img.width,320/img.height)*z,w=img.width*b,h=img.height*b;ox=Math.min(0,Math.max(320-w,ox));oy=Math.min(0,Math.max(320-h,oy));cx.fillStyle='#fff';cx.fillRect(0,0,320,320);cx.drawImage(img,ox,oy,w,h)};
  document.getElementById('fi').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{img=i;z=1;const b=Math.max(320/i.width,320/i.height);ox=(320-i.width*b)/2;oy=(320-i.height*b)/2;document.getElementById('cw').hidden=false;document.getElementById('cz').hidden=false;document.getElementById('czl').hidden=false;document.getElementById('fs').disabled=false;paint()};i.src=u});
  document.getElementById('cz').addEventListener('input',e=>{z=+e.target.value;paint()});
  const cw=document.getElementById('cw');
  cw.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY,ox,oy];cw.setPointerCapture(e.pointerId)});
  cw.addEventListener('pointermove',e=>{if(!drag)return;const s=320/cw.clientWidth;ox=drag[2]+(e.clientX-drag[0])*s;oy=drag[3]+(e.clientY-drag[1])*s;paint()});
  cw.addEventListener('pointerup',()=>drag=null);
  document.getElementById('fs').addEventListener('click',async()=>{const o=document.createElement('canvas');o.width=o.height=256;o.getContext('2d').drawImage(cc,0,0,256,256);const data=o.toDataURL('image/jpeg',.8);await store.saveFace(expr,data);ovEl.innerHTML='';refresh();toast('Face saved. Looking dangerous.')});

  const st=new Stage();st.exprFor=null;setLooks(st,S);st.hp={h:100,n:100};
  const P=res.outcome,win=P==='h'||P==='n'?P:null;
  ovEl.innerHTML=`<div class="full"><h2>Last week's fight</h2><div class="hp" style="width:100%;max-width:440px"><div class="h"><div class="nm"><span>Harshdeep</span><span id="fv-h">100</span></div><div class="bar"><i id="fp-h" style="width:100%"></i></div></div><div class="n"><div class="nm"><span>Nikki</span><span id="fv-n">100</span></div><div class="bar"><i id="fp-n" style="width:100%"></i></div></div></div><div class="stage" id="fs2" style="width:100%;max-width:440px"><div class="cap" id="fcap"></div></div><div id="fend" style="display:flex;flex-direction:column;gap:9px;align-items:center;width:100%;max-width:440px"><button class="btn w small" id="fskip">Skip</button></div></div>`;
  document.getElementById('fs2').prepend(st.cv);
  st.onCap=s=>{const el=document.getElementById('fcap');if(el)el.innerHTML=s?`<span>${esc(s)}</span>`:''};
  st.onHp=()=>{for(const k of['h','n']){const a=document.getElementById('fp-'+k),b=document.getElementById('fv-'+k);if(a)a.style.width=st.hp[k]+'%';if(b)b.textContent=Math.round(st.hp[k])}};
  /* squeeze the week into 8 big exchanges */
  const groups=[];const hs=res.hits;const per=Math.max(1,Math.ceil(hs.length/8));
  for(let i=0;i<hs.length;i+=per){const g=hs.slice(i,i+per);for(const by of['h','n']){const a=g.filter(x=>x.by===by);if(a.length)groups.push({by,vict:rival(by),amt:a.reduce((s,x)=>s+x.amt,0),cap:PL[by].name+': '+a[a.length-1].label})}}
  groups.forEach(g=>st.play(g));
  let done=false;
  const finish=()=>{if(done)return;done=true;clearInterval(wait);st.q=[];st.cur=null;
    st.hp={h:Math.max(0,100-res.dmg.n),n:Math.max(0,100-res.dmg.h)};
    if(P==='double'){st.hp={h:0,n:0}}else if(res.clean.h&&!res.clean.n)st.hp.n=0;else if(res.clean.n&&!res.clean.h)st.hp.h=0;
    st.onHp();st.onCap(null);sYay();lsSet('res-'+me+'-'+res.w,true);
    const line=k=>`${PL[k].name}, ${res.pct[k]}%: ${res.clean[k]?'cheat meal unlocked':`no cheat meal${res.karz[k]?', '+fmtN(res.karz[k])+' extra steps':''}`}`;
    const title=P==='double'?'Double KO':P==='draw'?'Draw':PL[P].name+' wins';
    const loser=win?rival(win):null;
    const canSpin=loser===me&&S.spins[res.w]===undefined;
    const spun=S.spins[res.w]!==undefined?`<p class="big" style="font-size:19px">${esc(PL[loser||me].name)}'s forfeit: ${esc(FORFEITS[S.spins[res.w]])}</p>`:'';
    document.getElementById('fend').innerHTML=`<p class="num" style="font-size:48px">${title}</p><p style="font-weight:700">${line('h')}</p><p style="font-weight:700">${line('n')}</p><p class="sub" style="color:var(--ink)">Boss Raid: ${res.raidWon?'won, +50 XP each':'lost, -20 XP each'}.${win?' '+PL[loser].name+' gets Revenge Monday.':''}</p>${spun}${canSpin?'<button class="btn p" id="fw">Spin the Penalty Wheel</button>':''}<button class="btn w" id="fc">Next week</button>`;
    document.getElementById('fc').onclick=()=>{st.alive=false;ovEl.innerHTML='';popupOpen=false;refresh()};
    const fw=document.getElementById('fw');if(fw)fw.onclick=()=>wheel(res,st);
  };
  document.getElementById('fskip').onclick=finish;
  const wait=setInterval(()=>{if(!st.q.length&&!st.cur){setTimeout(finish,500);clearInterval(wait)}},300);
  if(!groups.length||REDUCED)finish();
}
function wheel(res,st){
  const idx=Math.floor(Math.random()*FORFEITS.length);
  document.getElementById('fend').innerHTML=`<div class="ptr"></div><div class="wheel" id="wh"></div><p class="big" id="wt">Ghoom raha hai...</p><button class="btn w" id="wc" hidden>Next week</button>`;
  requestAnimationFrame(()=>{document.getElementById('wh').style.transform=`rotate(${1440+360-(idx*60+30)}deg)`});
  setTimeout(()=>{act('spin',{week:res.w,idx});sPunch();document.getElementById('wt').textContent=FORFEITS[idx];const c=document.getElementById('wc');c.hidden=false;c.onclick=()=>{st.alive=false;ovEl.innerHTML='';popupOpen=false;refresh()}},REDUCED?100:3300);
}

/* ---------- Preview mode ---------- */
function seedDemo(){
  const real=Date.now();const idx=dayIdx(dayKey(real));nowOff=(3-idx)*DAY; /* preview always opens on a Thursday */
  const t=now(),today=dayKey(t),wk=weekOf(today),out=[];
  const add=(actor,type,data,ts)=>out.push({id:uuid(),ts,actor,type,data});
  const say=(actor,day,q,extra,mins)=>{const ts=keyTs(day)+mins*60000;const id=uuid();out.push({id,ts,actor,type:'claim',data:{q,day,...extra}});add(rival(actor),'verdict',{claim:id,v:'ok'},ts+600000)};
  const fullDay=(k,day,o)=>{
    if(o.gym)say(k,day,'gym',{},600);if(k==='n'&&o.gym)say(k,day,'cardio',{},640);
    say(k,day,'steps',{n:o.steps},1250);[0,1,2].forEach(s=>{if(!o.miss||o.miss!==s+1)say(k,day,'meal',{slot:s},540+s*300)});
    if(k==='h'&&o.sleep)say(k,day,'sleep',{},1380);
  };
  const lw=addDays(wk,-7);
  [[1,6900,1],[0,7100,0],[0,6100,1],[1,5200,1],[0,6500,0],[1,6200,0],[0,6400,1]].forEach((r,i)=>fullDay('h',addDays(lw,i),{gym:r[0],steps:r[1],sleep:r[2]}));
  [1,1,1,1,1,0,0].forEach((g,i)=>fullDay('n',addDays(lw,i),{gym:g,steps:11000+i*100}));
  for(const k of['h','n'])for(let i=0;i<3;i++)say(k,addDays(lw,4),'content',{},700+i);
  for(let i=0;i<3;i++){const d=addDays(wk,i);fullDay('h',d,{gym:i!==1,steps:[7200,6300,6800][i],sleep:i!==1});fullDay('n',d,{gym:1,steps:[10400,12100,10200][i],miss:i===1?3:0})}
  say('n',today,'meal',{slot:0},560);
  add('n','slap',{n:58},t-3600000);add('n','nose',{reps:17},t-3000000);add('n','plank',{ms:102000},t-2700000);add('h','plank',{ms:74000},t-90000000);add('h','nose',{reps:12},t-90000000);
  out.push({id:'dq',ts:t-2000000,actor:'n',type:'answer',data:{day:today,text:'Late night maggi. No regrets.'}});
  add('n','rpd',{move:1},t-1500000);
  add('n','claim',{q:'gym',day:today},t-900000);
  return out;
}
let botCount=0;
function bot(ev){
  const r=rival(me);
  const later=(ms,fn)=>setTimeout(()=>{const save=me;fn(r);me=save;refresh()},ms);
  const raw=(type,data)=>{events.push({id:uuid(),ts:now(),actor:r,type,data});lsSet('demo',events)};
  if(ev.type==='claim')later(2200,()=>raw('verdict',{claim:ev.id,v:'ok'}));
  if(ev.type==='answer')later(3000,()=>{const A=(S.answers[S.today]||{});if(!A[r])raw('answer',{day:S.today,text:'Tumse behtar, as always.'})});
  if(ev.type==='ambush')later(4000,()=>raw('ambush_done',{ambush:ev.id}));
  if(ev.type==='rpd')later(3000,()=>{raw('rpd_reply',{game:ev.id,move:Math.floor(Math.random()*3)});const g=compute(events,now()).rpd.find(x=>x.id===ev.id);toast('Result: '+(g.winner?PL[g.winner].name+' won':'Draw'))});
  if(ev.type==='race_start')later(1500,()=>raw('nudge',{text:'Race on! Haarne ke liye taiyaar?',kind:'nudge'}));
  if(ev.type==='verdict'&&ev.data.v==='ok'&&++botCount%2===0)later(3500,()=>raw('nudge',{text:HYPES[Math.floor(Math.random()*HYPES.length)],kind:'hype'}));
  if(ev.type==='nudge')later(2500,()=>{const c={q:'steps',day:S.today,n:10800};raw('claim',c)});
}

/* ---------- Start ---------- */
async function startLive(){
  try{
    events=await store.loadAll();
  }catch(e){appEl.innerHTML=`<div class="login"><h2>Couldn't connect</h2><p class="sub">Check your internet and reopen the app.</p></div>`;return}
  refresh();store.subscribe();
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden){store.sync();refresh()}});
  setInterval(()=>{if(!document.hidden)store.sync()},30000);
}
async function boot(){
  if(LIVE){
    await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s)}).catch(()=>{});
    if(!window.supabase){appEl.innerHTML=`<div class="login"><h2>Couldn't load</h2><p class="sub">Check your internet and reopen the app.</p></div>`;return}
    sb=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey);
    const{data}=await sb.auth.getSession();
    const em=data.session&&data.session.user.email;
    me=em===PL.h.email?'h':em===PL.n.email?'n':null;
    if(me)startLive();else renderLogin();
  }else{
    me=lsGet('viewer','h');
    {const F=lsGet('faces',{h:{},n:{}}),D=window.DANGAL_DEFAULT_FACES||{h:{},n:{}};faces={h:{...D.h,...F.h},n:{...D.n,...F.n}}}
    const saved=lsGet('demo',null);
    if(saved){const idx=dayIdx(dayKey(Date.now()));nowOff=(3-idx)*DAY;events=saved}else{events=seedDemo();lsSet('demo',events)}
    refresh();
    setInterval(()=>{if(!document.hidden&&!ovEl.innerHTML)refresh()},20000);
  }
}
boot();
